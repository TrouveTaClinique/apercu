name: Publier l'aperçu

# Déclenché après chaque sync depuis TrouveTaClinique.github.io (branche brouillon).
# Ne configure jamais trouvetaclinique.ca (apex / www).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-apercu
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'TrouveTaClinique/apercu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuser toute revendication du domaine de production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f CNAME ]; then
            cname="$(tr -d '\r\n' < CNAME | tr '[:upper:]' '[:lower:]')"
            case "$cname" in
              apercu.trouvetaclinique.ca) ;;
              trouvetaclinique.ca|www.trouvetaclinique.ca)
                echo "CNAME de production détecté ($cname). Déploiement arrêté."
                exit 1
                ;;
              *)
                echo "CNAME inattendu ($cname). Attendu : apercu.trouvetaclinique.ca"
                exit 1
                ;;
            esac
          fi
          # Même garde-fou côté Settings Pages (API), si Pages est déjà configuré.
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ]; then
            api_cname="$(python3 -c 'import json; print((json.load(open("/tmp/pages.json")).get("cname") or "").strip().lower())')"
            case "$api_cname" in
              ''|apercu.trouvetaclinique.ca) ;;
              trouvetaclinique.ca|www.trouvetaclinique.ca)
                echo "Settings Pages revendique la production ($api_cname). Déploiement arrêté."
                exit 1
                ;;
              *)
                echo "Settings Pages : CNAME inattendu ($api_cname)."
                exit 1
                ;;
            esac
            build="$(python3 -c 'import json; print(json.load(open("/tmp/pages.json")).get("build_type") or "")')"
            if [ "$build" != "workflow" ]; then
              echo "Pages doit utiliser GitHub Actions (build_type=workflow)."
              exit 1
            fi
          elif [ "$code" != "404" ]; then
            echo "Lecture Pages refusée : HTTP $code"
            exit 1
          fi

      - name: Assembler le site public (sans .git ni .github)
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ ! -f index.html ]; then
            echo "index.html manquant — sync brouillon pas encore reçu."
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 \
            ! -name '_site' \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            ! -name 'README-PAGES.txt' \
            ! -name '.gitignore' \
            -exec cp -a {} _site/ \;
          test -f _site/index.html
          test -f _site/.nojekyll || touch _site/.nojekyll
          if [ -f _site/CNAME ]; then
            grep -qx 'apercu.trouvetaclinique.ca' _site/CNAME
          fi
          if [ -f _site/robots.txt ]; then
            grep -q 'Allow: /' _site/robots.txt
            ! grep -qiE 'Disallow:|/sitemap' _site/robots.txt
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
